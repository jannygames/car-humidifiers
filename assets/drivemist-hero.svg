<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1100" width="2400" height="1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset=".55" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#173253"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6fd3f0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6fd3f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fd3f0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#6fd3f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#9fb2c6"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a111d"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="mistglow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation=".45" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .mist path { fill: none; stroke: #bfeefc; stroke-linecap: round; stroke-dasharray: 60 28; animation: flow 3.4s linear infinite; }
    .mist path:nth-child(2) { animation-duration: 4.2s; }
    .mist path:nth-child(3) { animation-duration: 5s; }
    .mist path:nth-child(4) { animation-duration: 3.8s; }
    .glow { animation: pulse 4s ease-in-out infinite; }
    .bokeh circle { animation: twinkle 6s ease-in-out infinite; }
    .bokeh circle:nth-child(2n) { animation-delay: -2s; }
    .bokeh circle:nth-child(3n) { animation-delay: -4s; }
    .road path { stroke-dasharray: 120 90; animation: road 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: 176; } }
    @keyframes pulse { 50% { opacity: .45; } }
    @keyframes twinkle { 50% { opacity: .08; } }
    @keyframes road { to { stroke-dashoffset: 210; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="2400" height="1100" fill="url(#sky)"/>

  <g class="bokeh" filter="url(#soft)">
    <circle cx="180" cy="220" r="34" fill="#6fd3f0" opacity=".18"/>
    <circle cx="420" cy="140" r="16" fill="#ffc53d" opacity=".3"/>
    <circle cx="640" cy="300" r="22" fill="#8f7bff" opacity=".16"/>
    <circle cx="900" cy="170" r="12" fill="#ffffff" opacity=".28"/>
    <circle cx="1180" cy="250" r="40" fill="#ff7a45" opacity=".12"/>
    <circle cx="1460" cy="120" r="14" fill="#6fd3f0" opacity=".3"/>
    <circle cx="1720" cy="230" r="28" fill="#ffc53d" opacity=".16"/>
    <circle cx="1980" cy="150" r="18" fill="#ffffff" opacity=".22"/>
    <circle cx="2240" cy="280" r="36" fill="#6fd3f0" opacity=".14"/>
    <circle cx="300" cy="420" r="10" fill="#ffffff" opacity=".2"/>
    <circle cx="2100" cy="420" r="12" fill="#ff7a45" opacity=".22"/>
  </g>

  <path d="M0 640 L0 520 L80 520 L80 470 L150 470 L150 540 L230 540 L230 430 L290 430 L290 500 L380 500 L380 560 L470 560 L470 450 L540 450 L540 520 L640 520 L640 600 L760 600 L760 540 L840 540 L840 470 L920 470 L920 560 L1040 560 L1040 610 L1160 610 L1160 520 L1240 520 L1240 580 L1360 580 L1360 500 L1430 500 L1430 560 L1540 560 L1540 450 L1620 450 L1620 530 L1720 530 L1720 590 L1840 590 L1840 480 L1920 480 L1920 550 L2040 550 L2040 440 L2120 440 L2120 520 L2220 520 L2220 580 L2320 580 L2320 500 L2400 500 L2400 640 Z" fill="#0a1424" opacity=".9"/>

  <path d="M0 760 C600 690 1000 670 1200 670 S1800 690 2400 760 L2400 1100 L0 1100 Z" fill="url(#dash)"/>
  <path d="M0 760 C600 690 1000 670 1200 670 S1800 690 2400 760" fill="none" stroke="#6fd3f0" stroke-opacity=".35" stroke-width="3"/>
  <g class="road" fill="none" stroke="#6fd3f0" stroke-opacity=".18" stroke-width="4" stroke-linecap="round">
    <path d="M0 860 C600 800 1000 785 1200 785 S1800 800 2400 860"/>
  </g>

  <ellipse class="glow" cx="1620" cy="930" rx="560" ry="70" fill="url(#halo)"/>
  <ellipse cx="1520" cy="560" rx="620" ry="320" fill="url(#halo)" opacity=".35" filter="url(#blur)"/>
  <ellipse class="glow" cx="1040" cy="660" rx="140" ry="60" fill="url(#warm)"/>

  <g transform="translate(1000 205) scale(16)">
    <path class="glow" d="M57 38.6 L95 30 L95 50 L57 41.2 Z" fill="url(#beam)"/>
    <g class="mist" stroke-width="1.5" filter="url(#mistglow)">
      <path d="M24 35.6C19 33 15 34.5 11.5 32C9 30.2 7.5 30.6 5.5 31.6C2 33.3 -1.5 31.4 -5 29.6C-8.5 27.8 -12 28.4 -15 30" stroke-opacity=".9"/>
      <path d="M15.5 38.6C12.5 37.2 10.5 39 7.6 38C6 37.4 5 37.6 4 38.2C1 40 -2 38 -5 37.2C-8 36.4 -10.6 37.6 -13 38.6" stroke-opacity=".65" stroke-width="1.2"/>
      <path d="M14 42.2C12 41.6 10.5 43 8.5 42.4C6.5 41.8 4.8 42.6 3 43.4C0.4 44.6 -2.2 43.2 -4.6 42.6" stroke-opacity=".45" stroke-width="1"/>
      <path d="M22 34C18.5 30.5 14.6 31.6 12.4 28.8C10.6 26.4 7.6 26.6 5.4 27.6" stroke-opacity=".35" stroke-width=".8"/>
    </g>
    <path d="M14 41.5C14 39.6 15 38.4 16.8 37.9L24 36C27.5 32.6 31.5 31 36 31C40 31 43.3 32.2 46.2 34.6L48.6 36.4L54 37.6C55.6 38 56.6 39.2 56.6 40.8L56.6 42.6C56.6 43.6 55.8 44.4 54.8 44.4L51.6 44.4A4.6 4.6 0 0 0 42.4 44.4L28.6 44.4A4.6 4.6 0 0 0 19.4 44.4L15.6 44.4C14.7 44.4 14 43.7 14 42.8Z" fill="url(#body)"/>
    <path d="M28 36.2C30.5 34 33 33 36 33C39 33 41.6 34 43.6 35.6L44.6 36.4Z" fill="#0d1a2e"/>
    <path d="M30.4 35.2C32.2 34.1 34 33.7 35.6 33.7" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width=".35" stroke-linecap="round"/>
    <rect x="36.4" y="33" width="1.2" height="3.4" fill="#dfe6ee"/>
    <path d="M17 40.6H54" fill="none" stroke="#0b1220" stroke-opacity=".18" stroke-width=".3"/>
    <circle cx="24" cy="44.4" r="3.7" fill="#0b1220"/><circle cx="24" cy="44.4" r="2" fill="#5a6b7e"/><circle cx="24" cy="44.4" r=".7" fill="#0b1220"/>
    <circle cx="47" cy="44.4" r="3.7" fill="#0b1220"/><circle cx="47" cy="44.4" r="2" fill="#5a6b7e"/><circle cx="47" cy="44.4" r=".7" fill="#0b1220"/>
    <rect x="53.6" y="38.8" width="2.6" height="1.5" rx=".75" fill="#6fd3f0"/>
    <rect x="14.4" y="39" width="1.8" height="1.5" rx=".75" fill="#ff7a45"/>
  </g>
</svg>
